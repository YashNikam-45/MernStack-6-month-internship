<!DOCTYPE html>
<html>
<head>
    <title>College Fest Registration</title>
</head>
<body>
    <div class="container">
        <h1>College Fest 2026</h1>
        <h2>Registration Form</h2>
        <p>Register now and participate in our college fest!</p>

        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter email">

            <label>Phone Number:</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female

            <label>Select Course:</label>
            <select>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>MCA</option>
            </select>

            <label>Select Event:</label>
            <select>
                <option>Dance Competition</option>
                <option>Singing Competition</option>
                <option>Coding Competition</option>
                <option>Photography</option>
            </select>

            <label>Event Date:</label>
            <input type="date">

            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
