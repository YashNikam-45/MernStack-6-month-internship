
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>
    <link rel="stylesheet" href="navbarLinkedin.css">
    <script src="https://kit.fontawesome.com/ce11ca681c.js" crossorigin="anonymous"></script>
</head>
<body>

    <nav class="navbar">
        <div class="left">
            <div class="logo">in</div>
            <input type="text" placeholder="🔍  Search">
        </div>
        <div class="right">
            <div class="nav-item">
                <span><i class="fa-solid fa-house"></i></span>
                <p>Home</p>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-users"></i></span>
                <p>My Network</p>
                <b class="badge"><sub>5</sub></b>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-briefcase"></i></span>
                <p>Jobs</p>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-message"></i></span>
                <p>Messaging</p>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-bell"></i></span>
                <p>Notifications</p>
                <b class="badge">25</b>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-user"></i></span>
                <p>Me ▼</p>
            </div>

            <div class="nav-item">
                <span><i class="fa-solid fa-business-time"></i></span>
                <p>For Business</p>
            </div>

            <div class="premium">
                Try Premium for ₹0
            </div>

        </div>
    </nav>

</body>
</html>
