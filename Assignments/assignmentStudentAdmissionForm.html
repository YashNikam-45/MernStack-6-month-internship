<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>
<body>
    <main>
        <section>
            <h1>STUDENT ADMISSION FORM</h1>
            <div>
                <form>
                    <label>Enter Your Name:</label>
                    <input type="text" placeholder="Enter Your Name"> 
                    </br>
                    <label>Email:</label>
                    <input type="Text">
                    </br>
                    <label>Password:</label>
                    <input type="password" placeholder="********">
                    </br>
                    <label>Mobile Number:</label>
                    <input type="number">
                    </br>
                    <label>Birth date:</label>
                    <input type="date">
                    </br>
                    <label>Gender:</label>
                    </br>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    <input type="radio" id="others" name="gender" value="others">
                    <label for="others">Others</label>
                    </br>
                    <label>Hobbies</label>
                    <input type="checkbox">
                    <input type="checkbox">
                    <input type="checkbox">
                    <input type="checkbox">
                    </br>
                    <label>Address :</label>
                    <input type="Textarea" placeholder="Enter your address">
                    </br>
                    <label for="city">Course:</label>
                    <select id="city">
                        <option>MERN STACK</option>
                        <option>Python Fullstack</option>
                        <option>Data Analyst</option>
                        <option>Data Science</option>
                        <option>other</option>
                    </select>
                    </br>
                    <label>Upload Photo</label>
                    <input type="file">
                    </br>
                    <label>Pick Colour</label>
                    <input type="color">
                    </br>
                    <label>Skills Level</label>
                    <input type="range" min="0" max="100" value="30" name="volume">
                    </br>
                    <button>Reset</button>
                    <button>Submit</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
